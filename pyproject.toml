[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arpes-bands"
version = "0.1.0"
description = "Physics-supervised SRCNN for ARPES band position extraction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "torch>=2.2"]

[project.scripts]
arpes-bands = "arpes_bands.cli:main"

[tool.setuptools.packages.find]
include = ["arpes_bands*"]
